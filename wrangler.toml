name = "mcp-servicetitan"
main = "src/index.ts"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Smart Placement keeps this worker near D1 and the upstream proxy.
placement = { mode = "smart" }

[limits]
cpu_ms = 50

[observability]
enabled = true

[[analytics_engine_datasets]]
binding = "MCP_METRICS"
dataset = "mcp_servicetitan_metrics"

[ai]
binding = "AI"

[[workflows]]
name = "pricebook-embed"
binding = "EMBED_WORKFLOW"
class_name = "PricebookEmbedWorkflow"

[triggers]
crons = ["0 10 * * *"]

# Replace placeholder IDs with resources from your own Cloudflare account.
[[d1_databases]]
binding = "DB"
database_name = "mcp-servicetitan"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "PROXY_STATE"
id = "00000000000000000000000000000000"

# Phase-2 OAuth store (workers-oauth-provider). Real id — NOT a placeholder: the CI inject script
# only swaps the all-zero placeholder, so a real id passes through untouched, and KV ids are
# account-scoped identifiers (not secrets). Separate from qsc-hopper's OAUTH_KV (no grant bleed).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "0fc38122dc7b4f15b2e2c3403b688fa6"

# Service binding to your own ServiceTitan proxy worker. The proxy is expected
# to expose /api/st/read, /api/st/write, and queryD1-compatible behavior.
[[services]]
binding = "ST_PROXY"
service = "your-servicetitan-proxy"

[vars]
MCP_SERVICE_VERSION = "1.7.0"
ST_TENANT_ID = "000000000"
# Phase-2 OAuth (prod). SELF_ORIGIN pins the callback origin; ALLOWED_EMAILS is the in-worker
# allow-list. ACCESS_CLIENT_ID/ISSUER/SECRET are wrangler SECRETS (not committed — keeps the
# 64-hex client id out of git / gitleaks).
# ALLOWED_EMAILS real values are injected at deploy time by scripts/inject-deploy-config.py
# from the ALLOWED_EMAILS_PROD / ALLOWED_EMAILS_DEV GitHub Actions secrets. Never commit real
# addresses here - this repository is public (audit S-8, 2026-08-01).
SELF_ORIGIN = "https://mcp-servicetitan.lpeluso.workers.dev"
ALLOWED_EMAILS = "allowed@example.com"

# Secrets (set with `wrangler secret put`):
# MCP_SYNC_KEY - shared bearer between mcp-servicetitan and the upstream proxy
# SIRO_API_TOKEN - Siro org API token for v1 read endpoints
# ST_WEBHOOK_SECRET - ServiceTitan webhook HMAC-SHA256 secret
# JWT_SECRET - JWT signing secret for dual-mode auth
# ACCESS_CLIENT_ID / ACCESS_ISSUER / ACCESS_CLIENT_SECRET - Cloudflare Access SaaS-OIDC (Phase-2 OAuth)
# SUPABASE_URL - Supabase project URL (https://nlaaliehqpgskjmiuzze.supabase.co)
# SUPABASE_PB_KEY - dedicated connector Supabase secret key (read + embedding-column write)

[[durable_objects.bindings]]
name = "ST_RATE_LIMITER"
class_name = "StRateLimiter"

[[durable_objects.bindings]]
name = "CUSTOMER_SNAPSHOT_FLIGHT"
class_name = "CustomerSnapshotSingleflight"

[[migrations]]
tag = "v1"
new_classes = ["StRateLimiter", "CustomerSnapshotSingleflight"]

# DEV ENVIRONMENT
[env.dev]
name = "mcp-servicetitan-dev"
placement = { mode = "smart" }

[env.dev.observability]
enabled = true

[env.dev.limits]
cpu_ms = 50

[env.dev.vars]
MCP_SERVICE_VERSION = "1.7.0-dev"
ST_TENANT_ID = "000000000"
# Phase-2 OAuth (dev): SELF_ORIGIN = dev worker origin; ACCESS_* are wrangler secrets (see prod).
SELF_ORIGIN = "https://mcp-servicetitan-dev.lpeluso.workers.dev"
ALLOWED_EMAILS = "allowed@example.com"

[[env.dev.durable_objects.bindings]]
name = "ST_RATE_LIMITER"
class_name = "StRateLimiter"

[[env.dev.durable_objects.bindings]]
name = "CUSTOMER_SNAPSHOT_FLIGHT"
class_name = "CustomerSnapshotSingleflight"

[[env.dev.migrations]]
tag = "v1"
new_classes = ["StRateLimiter", "CustomerSnapshotSingleflight"]

[[env.dev.analytics_engine_datasets]]
binding = "MCP_METRICS"
dataset = "mcp_servicetitan_metrics_dev"

[env.dev.ai]
binding = "AI"

[[env.dev.workflows]]
name = "pricebook-embed-dev"
binding = "EMBED_WORKFLOW"
class_name = "PricebookEmbedWorkflow"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "mcp-servicetitan-dev"
database_id = "00000000-0000-0000-0000-000000000000"

[[env.dev.kv_namespaces]]
binding = "PROXY_STATE"
id = "00000000000000000000000000000000"

# Phase-2 OAuth store (dev) — real id; see prod note above.
[[env.dev.kv_namespaces]]
binding = "OAUTH_KV"
id = "d7fb3c58f8604a43a57df60206638a3b"

[[env.dev.services]]
binding = "ST_PROXY"
service = "your-servicetitan-proxy-dev"

# Intentional: dev cron shares the same idempotent backstop target (prod Supabase) as the
# prod worker's PricebookEmbedWorkflow cron — same predicate/model/projection, first writer
# wins, safe by design (harmless no-op if dev secrets are unset).
[env.dev.triggers]
crons = ["0 10 * * *"]

# Dev secrets (same command, add --env dev):
# wrangler secret put MCP_SYNC_KEY --env dev
# wrangler secret put SIRO_API_TOKEN --env dev
# wrangler secret put ST_WEBHOOK_SECRET --env dev
# wrangler secret put JWT_SECRET --env dev
