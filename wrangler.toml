name = "mcp-servicetitan"
main = "src/index.ts"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Smart Placement keeps this worker near D1 and the upstream proxy.
placement = { mode = "smart" }

[limits]
cpu_ms = 50

[observability]
enabled = true

[[analytics_engine_datasets]]
binding = "MCP_METRICS"
dataset = "mcp_servicetitan_metrics"

[triggers]
crons = []

# QSC tenant IDs. CF resource IDs are public identifiers, not secrets — the
# actual security boundary is the CLOUDFLARE_API_TOKEN (GH secret) and the
# MCP_SYNC_KEY / JWT_SECRET wrangler secrets.
[[d1_databases]]
binding = "DB"
database_name = "mcp-servicetitan"
database_id = "5380b37c-132c-4f21-a294-d99b7e05e6cf"

[[kv_namespaces]]
binding = "PROXY_STATE"
id = "4c18d1ac623145ab86901d5fb44a022a"

# Service binding to your own ServiceTitan proxy worker. The proxy is expected
# to expose /api/st/read, /api/st/write, and queryD1-compatible behavior.
[[services]]
binding = "ST_PROXY"
service = "taylor-ai"

[vars]
MCP_SERVICE_VERSION = "1.5.1"
ST_TENANT_ID = "431848990"

# Secrets (set with `wrangler secret put`):
# MCP_SYNC_KEY - shared bearer between mcp-servicetitan and the upstream proxy
# SIRO_API_TOKEN - Siro org API token for v1 read endpoints
# ST_WEBHOOK_SECRET - ServiceTitan webhook HMAC-SHA256 secret
# JWT_SECRET - JWT signing secret for dual-mode auth

[[durable_objects.bindings]]
name = "ST_RATE_LIMITER"
class_name = "StRateLimiter"

[[durable_objects.bindings]]
name = "CUSTOMER_SNAPSHOT_FLIGHT"
class_name = "CustomerSnapshotSingleflight"

[[migrations]]
tag = "v1"
new_classes = ["StRateLimiter", "CustomerSnapshotSingleflight"]

# DEV ENVIRONMENT
[env.dev]
name = "mcp-servicetitan-dev"
placement = { mode = "smart" }

[env.dev.observability]
enabled = true

[env.dev.limits]
cpu_ms = 50

[env.dev.vars]
MCP_SERVICE_VERSION = "1.5.1-dev"
ST_TENANT_ID = "431848990"

[[env.dev.durable_objects.bindings]]
name = "ST_RATE_LIMITER"
class_name = "StRateLimiter"

[[env.dev.durable_objects.bindings]]
name = "CUSTOMER_SNAPSHOT_FLIGHT"
class_name = "CustomerSnapshotSingleflight"

[[env.dev.migrations]]
tag = "v1"
new_classes = ["StRateLimiter", "CustomerSnapshotSingleflight"]

[[env.dev.analytics_engine_datasets]]
binding = "MCP_METRICS"
dataset = "mcp_servicetitan_metrics_dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "mcp-servicetitan-dev"
database_id = "74007593-70cd-462c-9a4c-75cf0771b4ee"

[[env.dev.kv_namespaces]]
binding = "PROXY_STATE"
id = "4c18d1ac623145ab86901d5fb44a022a"

# Dev points at the dev upstream worker, not prod. Note: taylor-ai-dev
# still uses the QSC ST OAuth client unless ST_CLIENT_ID / ST_CLIENT_SECRET
# were rotated per-env with `wrangler secret put --env dev` against a
# sandbox tenant — verify before relying on this for write smoke tests.
[[env.dev.services]]
binding = "ST_PROXY"
service = "taylor-ai-dev"

# Dev secrets (same command, add --env dev):
# wrangler secret put MCP_SYNC_KEY --env dev
# wrangler secret put SIRO_API_TOKEN --env dev
# wrangler secret put ST_WEBHOOK_SECRET --env dev
# wrangler secret put JWT_SECRET --env dev
