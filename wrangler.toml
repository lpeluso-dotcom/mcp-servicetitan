name = "mcp-servicetitan"
main = "src/index.ts"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Smart Placement keeps this worker near D1 and the upstream proxy.
placement = { mode = "smart" }

[limits]
cpu_ms = 50

[observability]
enabled = true

# Workers Tracing (open beta). Automatic spans cover the ST_PROXY service
# binding, D1 queries, DO fetches and Workers AI — exactly the per-request
# breakdown this worker has never had.
#
# head_sampling_rate IS SET DELIBERATELY AND MUST STAY SET. Tracing is free
# through 2026-09-30 and BILLED FROM 2026-10-01, and an unset rate defaults to
# 1.0 — 100% of requests. Choosing the number now is how we avoid discovering
# it on a bill. Sampling is head-based, so unsampled requests carry no overhead.
#
# NOTE ON OVERLAP: this worker already writes its own spans to the D1
# otel_span_queue (src/observability/tracing.ts, migrations/0005). That stays
# for now — it is one hand-rolled root span per MCP tool call, which native
# tracing does not replace one-for-one. Once native traces prove out, the D1
# `error_log` table becomes a candidate to retire. `audit_log` does NOT: it is
# the compliance record for a two-phase-confirm write system, not telemetry.
# Neither is touched in this change.
[observability.traces]
enabled = true
head_sampling_rate = 0.1

# ── Required secrets (enforced deploy gate) ──────────────────────────────────
# `wrangler deploy` and `wrangler versions upload` FAIL if any of these is not
# configured on the Worker, and `wrangler types` generates from this list rather
# than sniffing .dev.vars. This is the enforced form of the comment block that
# used to be the only record of what this worker needs; keep the two in sync.
[secrets]
required = [
  "MCP_SYNC_KEY",         # shared bearer between mcp-servicetitan and the upstream proxy
  "SIRO_API_TOKEN",       # Siro org API token for v1 read endpoints
  "ST_WEBHOOK_SECRET",    # ServiceTitan webhook HMAC-SHA256 secret
  "JWT_SECRET",           # JWT signing secret for dual-mode auth
  "ACCESS_CLIENT_ID",     # Cloudflare Access SaaS-OIDC (Phase-2 OAuth)
  "ACCESS_ISSUER",
  "ACCESS_CLIENT_SECRET",
  "SUPABASE_URL",         # Supabase project URL
  "SUPABASE_PB_KEY",      # dedicated connector Supabase secret key
]

# ── Native per-caller rate limit at the /mcp edge ────────────────────────────
# Keyed on the AUTHENTICATED actor in src/edge-rate-limit.ts, so one runaway
# agent client cannot fan a retry loop out into a pile of DO round trips.
#
# THIS IS NOT A REPLACEMENT FOR THE ST_RATE_LIMITER DURABLE OBJECT. The native
# binding is per-Cloudflare-location and eventually consistent — Cloudflare's
# docs say it is "intentionally designed to not be used as an accurate
# accounting system" — and `period` accepts only 10 or 60. It cannot enforce a
# GLOBAL ServiceTitan quota. Different problem, different tool, different layer.
[[ratelimits]]
name = "MCP_EDGE_RL"
namespace_id = "1001"

[ratelimits.simple]
limit = 240
period = 60

[[analytics_engine_datasets]]
binding = "MCP_METRICS"
dataset = "mcp_servicetitan_metrics"

[ai]
binding = "AI"

[[workflows]]
name = "pricebook-embed"
binding = "EMBED_WORKFLOW"
class_name = "PricebookEmbedWorkflow"

[triggers]
crons = ["0 10 * * *"]

# Replace placeholder IDs with resources from your own Cloudflare account.
[[d1_databases]]
binding = "DB"
database_name = "mcp-servicetitan"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "PROXY_STATE"
id = "00000000000000000000000000000000"

# Phase-2 OAuth store (workers-oauth-provider). Real id — NOT a placeholder: the CI inject script
# only swaps the all-zero placeholder, so a real id passes through untouched, and KV ids are
# account-scoped identifiers (not secrets). Separate from qsc-hopper's OAUTH_KV (no grant bleed).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "0fc38122dc7b4f15b2e2c3403b688fa6"

# Read-through cache store (src/cache.ts). Replaces the D1 `mcp_cache` table,
# whose expired rows NOTHING ever deletes — idx_mcp_cache_expires exists but the
# only DELETE is cachePurgeNamespace, by namespace. KV expires entries itself and
# is read at the edge instead of round-tripping to the single-region D1 primary.
# Reached only when CACHE_BACKEND is "dual" or "kv"; see [vars].
# Its id needs its OWN GH secret (KV_CACHE_NAMESPACE_ID_PROD/DEV) — do not point
# it at PROXY_STATE's namespace, whose keyspace it would collide with.
[[kv_namespaces]]
binding = "MCP_CACHE"
id = "00000000000000000000000000000000"

# Service binding to your own ServiceTitan proxy worker. The proxy is expected
# to expose /api/st/read, /api/st/write, and queryD1-compatible behavior.
[[services]]
binding = "ST_PROXY"
service = "your-servicetitan-proxy"

[vars]
MCP_SERVICE_VERSION = "1.7.0"
# Stamped by .github/workflows/deploy.yml from the deployed commit; the deploy
# fails if this placeholder survives. Never hand-edit.
GIT_SHA = "unknown"
ST_TENANT_ID = "000000000"
# audit S-2: verifyJwt now ALWAYS requires a numeric `exp` (a token without one
# used to be valid forever) and enforces `aud`/`iss` whenever they are set.
# JWT_AUDIENCE and JWT_ISSUER are deliberately UNSET in prod: no JWT minter has
# been identified, audit_log shows no `jwt-client` actor in 30 days, and
# audit_log does not record authMode - so enabling audience checking here would
# be a guess that could reject an unidentified live caller. Both are enabled in
# [env.dev.vars] for verification. Set them in prod once the minter is known;
# the code enforces them the moment they exist.
# Phase-2 OAuth (prod). SELF_ORIGIN pins the callback origin; ALLOWED_EMAILS is the in-worker
# allow-list. ACCESS_CLIENT_ID/ISSUER/SECRET are wrangler SECRETS (not committed — keeps the
# 64-hex client id out of git / gitleaks).
# ALLOWED_EMAILS real values are injected at deploy time by scripts/inject-deploy-config.py
# from the ALLOWED_EMAILS_PROD / ALLOWED_EMAILS_DEV GitHub Actions secrets. Never commit real
# addresses here - this repository is public (audit S-8, 2026-08-01).
SELF_ORIGIN = "https://mcp-servicetitan.lpeluso.workers.dev"
ALLOWED_EMAILS = "allowed@example.com"
# Cache backend cutover (src/cache.ts). "d1" = today's behaviour, byte for byte.
# Stage: "d1" → "dual" (write both, read KV first, warm the store) → "kv".
# Roll back by setting this back to "d1"; no code change, no redeploy of logic.
CACHE_BACKEND = "d1"

# Secrets: the ENFORCED list is the [secrets] `required` array near the top of
# this file — `wrangler deploy` fails if any is unset. Set each with
# `wrangler secret put <NAME>`. Notes on the two non-obvious ones:
# SUPABASE_URL - Supabase project URL (https://nlaaliehqpgskjmiuzze.supabase.co)
# SUPABASE_PB_KEY - dedicated connector Supabase secret key (read + embedding-column write)

[[durable_objects.bindings]]
name = "ST_RATE_LIMITER"
class_name = "StRateLimiter"

[[durable_objects.bindings]]
name = "CUSTOMER_SNAPSHOT_FLIGHT"
class_name = "CustomerSnapshotSingleflight"

[[migrations]]
tag = "v1"
new_classes = ["StRateLimiter", "CustomerSnapshotSingleflight"]

# DEV ENVIRONMENT
[env.dev]
name = "mcp-servicetitan-dev"
placement = { mode = "smart" }

[env.dev.observability]
enabled = true

# Dev traffic is negligible, so trace it all — the point of dev is to see the
# whole span tree before prod samples it down to 10%.
[env.dev.observability.traces]
enabled = true
head_sampling_rate = 1

# Declared EXPLICITLY rather than inherited from the top-level [secrets]: this
# repo should not have to guess at wrangler's environment-inheritance rules for
# a property that fails the deploy when it is wrong.
#
# SUPABASE_URL / SUPABASE_PB_KEY are deliberately ABSENT. This file already
# documents the dev cron as "a harmless no-op if dev secrets are unset";
# requiring them here would convert that documented no-op into a hard
# dev-deploy failure. Add them once dev actually carries Supabase credentials.
[env.dev.secrets]
required = [
  "MCP_SYNC_KEY",
  "SIRO_API_TOKEN",
  "ST_WEBHOOK_SECRET",
  "JWT_SECRET",
  "ACCESS_CLIENT_ID",
  "ACCESS_ISSUER",
  "ACCESS_CLIENT_SECRET",
]

# Same guard as prod, same caveat: per-location, eventually consistent, and no
# substitute for the ST_RATE_LIMITER DO. Tighter here so dev trips it first.
[[env.dev.ratelimits]]
name = "MCP_EDGE_RL"
namespace_id = "1002"

[env.dev.ratelimits.simple]
limit = 120
period = 60

[env.dev.limits]
cpu_ms = 50

[env.dev.vars]
MCP_SERVICE_VERSION = "1.7.0-dev"
# Stamped by deploy.yml from the deployed commit; the deploy fails if this
# placeholder survives. Never hand-edit.
GIT_SHA = "unknown"
ST_TENANT_ID = "000000000"
# audit S-2: enabled in dev so audience enforcement is exercised before prod.
JWT_AUDIENCE = "mcp-servicetitan"
# Phase-2 OAuth (dev): SELF_ORIGIN = dev worker origin; ACCESS_* are wrangler secrets (see prod).
SELF_ORIGIN = "https://mcp-servicetitan-dev.lpeluso.workers.dev"
ALLOWED_EMAILS = "allowed@example.com"
# Dev runs one stage AHEAD of prod so the KV path is actually exercised (and its
# D1 fallback still covers it) before prod ever reads from KV.
CACHE_BACKEND = "dual"

[[env.dev.durable_objects.bindings]]
name = "ST_RATE_LIMITER"
class_name = "StRateLimiter"

[[env.dev.durable_objects.bindings]]
name = "CUSTOMER_SNAPSHOT_FLIGHT"
class_name = "CustomerSnapshotSingleflight"

[[env.dev.migrations]]
tag = "v1"
new_classes = ["StRateLimiter", "CustomerSnapshotSingleflight"]

[[env.dev.analytics_engine_datasets]]
binding = "MCP_METRICS"
dataset = "mcp_servicetitan_metrics_dev"

[env.dev.ai]
binding = "AI"

[[env.dev.workflows]]
name = "pricebook-embed-dev"
binding = "EMBED_WORKFLOW"
class_name = "PricebookEmbedWorkflow"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "mcp-servicetitan-dev"
database_id = "00000000-0000-0000-0000-000000000000"

[[env.dev.kv_namespaces]]
binding = "PROXY_STATE"
id = "00000000000000000000000000000000"

# Phase-2 OAuth store (dev) — real id; see prod note above.
[[env.dev.kv_namespaces]]
binding = "OAUTH_KV"
id = "d7fb3c58f8604a43a57df60206638a3b"

# Read-through cache store (dev) — see the prod block for why this exists.
[[env.dev.kv_namespaces]]
binding = "MCP_CACHE"
id = "00000000000000000000000000000000"

[[env.dev.services]]
binding = "ST_PROXY"
service = "your-servicetitan-proxy-dev"

# Intentional: dev cron shares the same idempotent backstop target (prod Supabase) as the
# prod worker's PricebookEmbedWorkflow cron — same predicate/model/projection, first writer
# wins, safe by design (harmless no-op if dev secrets are unset).
[env.dev.triggers]
crons = ["0 10 * * *"]

# Dev secrets (same command, add --env dev):
# wrangler secret put MCP_SYNC_KEY --env dev
# wrangler secret put SIRO_API_TOKEN --env dev
# wrangler secret put ST_WEBHOOK_SECRET --env dev
# wrangler secret put JWT_SECRET --env dev
