name: Deploy to Cloudflare

# Manual deploy only. CI validates pushes and pull requests; deployment is kept
# explicit so public-feedback changes are not coupled directly to the live worker.
#
# wrangler.toml is committed with placeholder IDs so the repo stays
# fork-friendly. Real Cloudflare resource IDs are injected at deploy time
# from GitHub Actions secrets via the "Inject deploy config" step below.
#
# Setup (one-time, on your-org/mcp-servicetitan):
#   gh secret set CLOUDFLARE_API_TOKEN     --body "<api-token>"
#   gh secret set ST_TENANT_ID             --body "<tenant-id>"
#   gh secret set D1_DATABASE_ID_PROD      --body "<uuid>"
#   gh secret set D1_DATABASE_ID_DEV       --body "<uuid>"
#   gh secret set KV_NAMESPACE_ID_PROD     --body "<32-char-id>"
#   gh secret set KV_NAMESPACE_ID_DEV      --body "<32-char-id>"
#   gh secret set ST_PROXY_SERVICE_PROD    --body "<worker-name>"  # e.g. taylor-ai
#   gh secret set ST_PROXY_SERVICE_DEV     --body "<worker-name>"  # e.g. taylor-ai-dev
#
# All eight are required for a clean deploy. If any of the resource-ID
# secrets are missing, the "Inject deploy config" step will leave the
# placeholder in place and the subsequent wrangler deploy will fail with
# a clear "namespace not found" / "database not found" error.
#
# Manual trigger:
#   gh workflow run deploy.yml -f env=prod

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Deploy environment"
        required: false
        default: "prod"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.event.inputs.env || 'prod' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install gitleaks
        run: |
          VERSION=v8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Substitute placeholder IDs in wrangler.toml with real values from
      # GH Actions secrets. The committed wrangler.toml uses all-zero
      # placeholders so the repo stays fork-friendly; this step runs in
      # CI only and never writes back to git.
      #
      # Implementation in scripts/inject-deploy-config.py — see that file
      # for the section-aware substitution logic.
      - name: Inject deploy config from secrets
        env:
          ST_TENANT_ID:          ${{ secrets.ST_TENANT_ID }}
          D1_DATABASE_ID_PROD:   ${{ secrets.D1_DATABASE_ID_PROD }}
          D1_DATABASE_ID_DEV:    ${{ secrets.D1_DATABASE_ID_DEV }}
          KV_NAMESPACE_ID_PROD:  ${{ secrets.KV_NAMESPACE_ID_PROD }}
          KV_NAMESPACE_ID_DEV:   ${{ secrets.KV_NAMESPACE_ID_DEV }}
          ST_PROXY_SERVICE_PROD: ${{ secrets.ST_PROXY_SERVICE_PROD }}
          ST_PROXY_SERVICE_DEV:  ${{ secrets.ST_PROXY_SERVICE_DEV }}
        run: python3 scripts/inject-deploy-config.py

      # Preflight runs the full pre-deploy gate: file presence, bindings,
      # secrets, and local repository hygiene.
      - name: Preflight
        run: bash scripts/preflight.sh --env $DEPLOY_ENV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # wrangler.toml's top-level config is prod; only dev is a named override.
      - name: Deploy to Cloudflare
        run: |
          if [ "$DEPLOY_ENV" = "dev" ]; then
            npx wrangler deploy --env dev
          else
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
